[package]
# Not `termlens`, though the gate checks the package of that name: the
# selftest names this one with SEMVER_GATE_PACKAGE, and a second
# `termlens` under the repository makes cargo-semver-checks refuse the real
# one as ambiguous.
name = "gate-model"
version = "0.10.1"
edition = "2021"
publish = false

[features]
render = []
regex = []
serde = []

# Standalone on purpose: a member of the termlens workspace would be built,
# formatted and linted as part of the product, and this is a test fixture
# for the gate, not code anyone ships.
[workspace]
