# zizmor configuration — accepted findings, each with a rationale.
# The CI `zizmor` job runs at --persona=pedantic, so anything not listed
# here fails the build.

rules:
  # dtolnay/rust-toolchain is deliberate, not superfluous: it pins the
  # toolchain snapshot by commit SHA, installs rustfmt/clippy components
  # reproducibly, and honors rust-toolchain.toml — the preinstalled runner
  # toolchain drifts with the image.
  superfluous-actions:
    ignore:
      - ci.yml
      - stress.yml
      - release.yml
      - install.yml
      - windows.yml
      - publish-cli.yml

  # Correct advice that this one workflow cannot take, which is the whole
  # reason it exists. Trusted Publishing is configured per crate on a crate
  # that already exists, so the *first* publish of a new name has nothing to
  # configure it against and must use a token. Every other publish here is
  # Trusted Publishing (release.yml), and this file is deleted along with the
  # secret once crates.io knows termlens-cli.
  use-trusted-publishing:
    ignore:
      - publish-cli.yml
