# Release pipeline, triggered by pushing a v*.*.* tag.
# The human-side checklist lives in docs/RELEASING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never cancel a release mid-publish; a duplicate tag push queues instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Compare tag against crates/termlens version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "termlens") | .version')"
          echo "tag=${tag} crate=${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match crates/termlens version ${version}. Bump the version (docs/RELEASING.md) before tagging."
            exit 1
          fi

  # Re-run the exact CI gates (fmt, clippy, test matrix, msrv, docs, deny).
  ci:
    name: ci
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  semver:
    name: cargo-semver-checks
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Look for a published baseline on crates.io
        id: published
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/termlens)"
          echo "crates.io responded ${status}"
          echo "found=$([ "$status" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Skip (first release, no baseline)
        if: steps.published.outputs.found != 'true'
        run: echo "termlens is not on crates.io yet; skipping semver checks gracefully."
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        if: steps.published.outputs.found == 'true'
        with:
          package: termlens

  publish:
    name: publish to crates.io
    needs: [ci, semver]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # Preferred auth: crates.io Trusted Publishing. Needs the one-time
      # linkage of this repo+workflow on crates.io (docs/RELEASING.md).
      # Until that exists, the step fails soft and we fall back to a
      # CARGO_REGISTRY_TOKEN repository secret.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        continue-on-error: true
      - run: cargo publish -p termlens --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Extract notes from CHANGELOG.md
        run: .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
