name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reused by release.yml so a release re-runs the exact same gates.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The reduced sets select the library alone: with --workspace the CLI's
      # `features = ["serde"]` is unified into the library and the "minimal"
      # build being linted is not minimal (#324).
      - run: cargo clippy -p termlens --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p termlens --all-targets --no-default-features --features decode -- -D warnings

  # CI runners have no TTY; termlens creates its own PTYs. This suite passing
  # headless is the proof of the crate's core value claim.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-features
        env:
          TERMLENS_ARTIFACT_DIR: ${{ runner.temp }}/termlens
      # The CLI's documented exit codes, against this tree. `install.yml`
      # runs the same script against the *published* binary, which is the
      # net; this is the fast feedback. #310 was a `--version` that exited 2
      # in two published releases and was found by a user, so the point is
      # to fail on the pull request rather than after the publish.
      - run: cargo build -p termlens-cli
      - run: .github/scripts/check-cli-contract.sh target/debug/termlens
      # The README is shipped as this crate's readme, and crates.io rewrites
      # a relative link against crates/termlens/ rather than the repo root.
      # Every relative link on the 0.10.2 page was a 404 and nothing here
      # could see it, because the same file renders correctly on GitHub.
      - run: .github/scripts/check-readme-links.sh
      # The screens of whatever failed, in the step summary (#251). The
      # suite dogfoods the action with the CLI from this tree.
      - uses: ./.github/actions/report
        if: failure()
        with:
          cli: workspace
          name: termlens-report-${{ matrix.os }}

  # Every feature configuration a consumer can ask for. The default set is
  # what `cargo add termlens --dev` produces, and until #226 no job ran it:
  # `test` runs --all-features and this job ran only the two reduced sets.
  # Additivity makes a gap there unlikely, not impossible, and the cell
  # costs about ninety seconds.
  #
  # Each reduced configuration selects the library alone (#324). Cargo
  # unifies features across every package in one invocation, and
  # termlens-cli depends on the library with `features = ["serde"]`, so the
  # `--workspace` form of these tested a "minimal" library that had serde on
  # — and `tests/record.rs` used serde_json unconditionally without anything
  # here noticing. `check-feature-isolation.sh` asserts the selection really
  # is isolated, so the --workspace form cannot come back quietly.
  #
  # Priced and deferred, deliberately (#226): the default set on the macOS
  # leg — a second full suite per PR for a fault class the stress workflow
  # is better placed to find. The other half #226 deferred, a
  # --no-default-features consumer in install.yml, landed with #238: that
  # workflow's matrix now runs both shapes, and its registry step demands
  # `decode` only on the leg that asks for it.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: .github/scripts/check-feature-isolation.sh
      - run: cargo test -p termlens --no-default-features
      - run: cargo test -p termlens --no-default-features --features decode
      - run: cargo test -p termlens --no-default-features --features regex
      - run: cargo test -p termlens --no-default-features --features serde
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The crate compiles for Windows and nothing ran the compiler to prove it
  # (#149): that build was rotting unwatched, and the cost of watching it is
  # one cross-target clippy on a Linux runner — no Windows machine involved.
  # `cargo check`/`clippy` need only the target's std, which rustup installs;
  # linking and running are what need Windows, and those are windows.yml.
  windows-check:
    name: windows-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings

  # The Windows leg (#149): the whole suite over ConPTY, with the tests that
  # ConPTY cannot honour marked `#[cfg_attr(windows, ignore = "…")]`, each
  # with its reason. Required since #280: it ran non-required first and held
  # on every push to main from the day it landed through the 0.10 series.
  # A ConPTY surprise now blocks a merge, which is the point — the platform
  # is claimed in docs/STABILITY.md. windows.yml is the dispatchable version
  # with the ConPTY probe and the report, for reading rather than gating.
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - run: cargo test --workspace --all-features

  # CONTRIBUTING §1 promises that every gate above is reproducible locally
  # and that the workflow is the source of truth when the two disagree. It
  # disagreed twice before anyone noticed (#227); this is the check that
  # makes the promise hold.
  gates-listed:
    name: gates-listed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: .github/scripts/check-ci-gates-listed.sh

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          echo "MSRV: ${msrv}"
          echo "msrv=${msrv}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # rust-toolchain.toml pins stable so that fmt and clippy output is
      # reproducible, and rustup honours that file over the `rustup default`
      # the action above sets — so this job installed 1.85 and then ran
      # stable (#213). RUSTUP_TOOLCHAIN outranks the file, and the assertion
      # makes the no-op impossible to bring back quietly.
      - name: Assert the MSRV toolchain is the one in use
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: |
          rustc -vV
          rustc -vV | grep -q "^release: ${MSRV}" \
            || { echo "::error::the msrv job is not running rustc ${MSRV}"; exit 1; }
      # --all-targets: tests and examples compile against the same floor,
      # so they are part of the claim. Passes at 1.85 today without a bump.
      # The one exclusion is the ratatui fixture: ratatui 0.30 needs 1.88,
      # and a fixture's floor is not the library's (#252). Its own
      # `rust-version` says so, and the `test` job builds it on stable.
      - run: cargo check --workspace --exclude ratatui-app --locked --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
      # --all-targets does not enable optional features, so `decode`, `regex`
      # and the library's `serde` code had never met 1.85 in CI while the
      # README advertised one MSRV for the crate (#325). Both ends of the
      # feature axis, for the library alone so nothing is unified in.
      - run: cargo check -p termlens --all-features --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
      - run: cargo check -p termlens --no-default-features --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}

  # The public API against the last published release, on every pull request
  # and every push to main (#323). Two things a naive run gets wrong, both
  # measured and both pinned by the self-test that runs first: a version bump
  # in the same PR as a break makes the inferred release type "major" and
  # skips every check, so the type is forced; and --all-features cannot see
  # an item moved behind a feature, so three views run. A deliberate break
  # carries the `breaking` label (the release type becomes `major`, and the
  # diagnostics go in the PR description) — and is recorded in CHANGELOG.md
  # as a `- **Breaking` bullet, which is what keeps main green after the
  # merge, where no label exists. `.github/scripts/check-semver.sh` has the
  # rules; docs/RELEASING.md says when the baseline literal below moves.
  #
  # The checker is a prebuilt binary downloaded every run: never built from
  # source and never restored from a cache, so a green run is evidence about
  # this tree and today's checker rather than about the day a cache filled.
  semver:
    name: semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-semver-checks
      - run: tools/semver-gate-selftest/run.sh
      - run: .github/scripts/check-semver.sh 0.11.0
        env:
          BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --no-deps
      - run: cargo doc --no-deps --all-features
      # The stability-candidate statement is made in README.md, the CHANGELOG
      # header and docs/STABILITY.md, in the same words (#328, #334). Three
      # copies of one promise drift; this is the check that stops it.
      - run: .github/scripts/check-candidate-statement.sh

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # Workflow security audit (template injection, credential persistence,
  # unpinned actions, …). Accepted findings live in .github/zizmor.yml.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit workflows at pedantic level
        env:
          GH_TOKEN: ${{ github.token }}
        # Version pinned; bump deliberately alongside a fresh local audit.
        # pipx ships on the runner image (uv/uvx does not).
        #
        # One retry after a pause: the online audits call the GitHub
        # advisories API, and a transient network error there once blocked
        # a release (run 31307319409). A genuine finding fails identically
        # on the retry, so nothing real can slip through.
        run: |
          audit() { pipx run zizmor==1.29.0 --persona=pedantic .github/workflows/; }
          audit || {
            echo "::warning::zizmor failed; retrying once in 30s in case of a transient online-audit network error"
            sleep 30
            audit
          }

  # Single stable job name for branch protection: require this one check and
  # matrix/job changes never break the required-checks configuration.
  # The skill for coding agents (skills/termlens/SKILL.md) is what an agent
  # copies from, so a recipe that no longer compiles teaches the wrong API to
  # everyone who installed it. Every Rust block in it is compiled against the
  # crate in this checkout, inside a consumer that owns a `myapp` binary.
  skill:
    name: skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - run: .github/scripts/check-skill-snippets.sh

  required-green:
    name: required-green
    if: always()
    needs: [fmt, clippy, test, features, windows-check, windows, msrv, semver, docs, deny, zizmor, gates-listed, skill]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
