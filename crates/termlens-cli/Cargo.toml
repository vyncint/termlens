[package]
name = "termlens-cli"
description = "The termlens command: run a program in a PTY and print its screen, diff two saved screens, render one as SVG, HTML, ANSI, the text format or JSON"
keywords = ["pty", "terminal", "testing", "tui", "snapshot"]
categories = ["development-tools::testing", "command-line-interface"]
readme = "README.md"
# The tests drive the built binary from the workspace, and the corpus test
# reads `../termlens/tests/compat`, which is outside this package and not in
# the library's either: from an unpacked download `cargo test` could only
# fail. The library excludes its suite for the same reason (#385, #519).
exclude = ["tests/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "termlens"
path = "src/main.rs"
# The binary shares its name with the library it wraps; documenting it would
# collide with the library's docs under `cargo doc --workspace`, and a
# binary's rustdoc is its README anyway.
doc = false

[dependencies]
# The version is the one release bumps alongside `workspace.package.version`
# (docs/RELEASING.md); a path dependency needs it to publish. `serde` so a
# saved screen can be JSON as well as the text format.
termlens = { version = "0.11.5", path = "../termlens", default-features = false, features = ["serde"] }
serde_json.workspace = true

[lints]
workspace = true
