[package]
name = "termlens"
description = "Headless PTY test harness for CLI/TUI apps — spawn in a real PTY, assert on the rendered screen"
keywords = ["pty", "terminal", "testing", "tui", "snapshot"]
categories = ["development-tools::testing", "command-line-interface"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["insta"]
# Snapshot-testing glue: re-exports `insta` and provides
# `assert_screen_snapshot!`. Disable if you bring your own snapshot tool.
insta = ["dep:insta"]
# Decoding inline graphics payloads into pixels: `GraphicsPayload::decode`
# and `Bitmap`. Off by default because it is the one thing here that needs a
# dependency of its own (zlib, for kitty's `o=z`), and a suite that only asks
# whether an image went out should not pay for it. Every other fact about a
# payload — placement, declared size, format, id — is free and always on.
decode = ["dep:miniz_oxide"]

[dependencies]
portable-pty.workspace = true
vt100.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
# Insert mode reserves room for a printable run with `ICH`, sized in columns;
# a wide character counts twice, and this is what says so (#261). Already in
# the tree through vt100.
unicode-width.workspace = true
insta = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
insta.workspace = true
anyhow.workspace = true

[lints]
workspace = true
